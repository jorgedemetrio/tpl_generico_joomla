permissions:
  contents: read
name: Build
on:
  push:
    branches:
      - master
      - develop
      - release
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  validate:
    name: Validate Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: phpmd

      - name: PHP Syntax Check (lint)
        run: |
          find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

      - name: PHP Mess Detector (PHPMD)
        run: |
          phpmd . github phpmd.xml --exclude "vendor/*,build_temp/*"
        continue-on-error: true

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: validate
    # PRs de forks nao recebem secrets (SONAR_TOKEN fica vazio) -> a API do
    # SonarCloud responde 403 na provisao do JRE. So roda com o token
    # disponivel: push no repo ou PR vindo do proprio repositorio.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}